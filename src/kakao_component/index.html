<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --ink:#10231c; --muted:#66756f; --paper:#f5f7f4; --line:#dfe6e1; --green:#0d6b4f; --orange:#ed7a2c; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:transparent; }
    button, input, select { font:inherit; }
    .shell { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(340px,.9fr); grid-template-rows:minmax(0,1fr); height:100%; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#fff; }
    .map-wrap { position:relative; min-width:0; min-height:0; overflow:hidden; background:#e8ede9; }
    #map { width:100%; height:100%; }
    .map-empty { position:absolute; inset:0; display:none; place-items:center; padding:32px; text-align:center; background:linear-gradient(135deg,#e8f2ec,#f8f3e9); z-index:3; }
    .map-empty strong { display:block; font-size:21px; margin-bottom:8px; }
    .map-empty code { display:inline-block; margin-top:10px; padding:7px 10px; border-radius:8px; background:#fff; border:1px solid var(--line); }
    .legend { position:absolute; left:16px; bottom:16px; z-index:2; display:flex; gap:9px; align-items:center; padding:9px 12px; border-radius:999px; background:rgba(255,255,255,.94); box-shadow:0 4px 18px rgba(16,35,28,.12); font-size:12px; }
    .pulse-halo { width:34px; height:34px; border-radius:50%; background:rgba(224,51,42,.55); animation:pulse-halo 1.4s ease-out infinite; pointer-events:none; }
    @keyframes pulse-halo {
      0% { transform:scale(0.4); opacity:.9; }
      100% { transform:scale(2.4); opacity:0; }
    }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:4px; }
    .marker-menu { position:absolute; z-index:20; display:none; min-width:190px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(16,35,28,.2); padding:6px; }
    .marker-menu .mm-title { font-size:11px; color:var(--muted); padding:6px 10px 4px; }
    .marker-menu button { width:100%; display:flex; align-items:center; gap:8px; text-align:left; padding:9px 10px; border:0; background:transparent; border-radius:8px; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); }
    .marker-menu button:hover { background:#f2f6f2; }
    .marker-menu .mm-repair { color:#0d6b4f; }
    .marker-menu .mm-inspect { color:#2c5aa0; }
    .marker-menu .mm-cancel { color:var(--muted); font-weight:600; }
    .side { min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; border-left:1px solid var(--line); background:#fbfcfa; }
    .side-head { padding:20px 18px 14px; border-bottom:1px solid var(--line); background:#fff; }
    .eyebrow { font-size:11px; letter-spacing:.13em; color:var(--green); font-weight:800; }
    h2 { margin:5px 0 4px; font-size:21px; letter-spacing:-.04em; }
    .sub { color:var(--muted); font-size:12px; }
    .controls { display:grid; grid-template-columns:1fr 110px; gap:8px; margin-top:14px; }
    input, select { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; background:#fff; color:var(--ink); outline:none; }
    input:focus, select:focus { border-color:#64a88e; box-shadow:0 0 0 3px rgba(13,107,79,.08); }
    .list { flex:1; min-height:0; overflow:auto; padding:10px; }
    .card { width:100%; display:grid; grid-template-columns:18px 44px 1fr 46px; gap:8px; align-items:center; border:1px solid transparent; border-bottom-color:var(--line); background:transparent; padding:12px 8px; text-align:left; cursor:pointer; color:inherit; }
    .card:hover, .card.active { background:#fff; border-color:#cfdad3; border-radius:12px; box-shadow:0 5px 16px rgba(16,35,28,.06); }
    .rank { text-align:center; color:var(--muted); font-weight:750; font-size:11px; }
    .score-inline { text-align:right; font-weight:850; font-size:13px; white-space:nowrap; }
    .name { font-weight:780; font-size:14px; }
    .reason { margin-top:4px; color:var(--muted); font-size:11px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
    .level { text-align:right; font-size:10px; font-weight:750; white-space:nowrap; word-break:keep-all; }
    .detail { display:none; padding:14px 18px 18px; border-top:1px solid var(--line); background:#fff; }
    .detail.show { display:block; }
    .detail-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .detail-title { font-weight:850; }
    .close { border:0; background:#eef2ef; border-radius:8px; width:28px; height:28px; cursor:pointer; }
    .detail-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .metric { padding:9px; border-radius:10px; background:#f4f6f3; }
    .metric b { display:block; font-size:14px; }
    .metric span { color:var(--muted); font-size:10px; }
    .detail-reason { margin-top:10px; padding:10px; border-left:3px solid var(--orange); background:#fff8f1; color:#6d4b32; font-size:12px; line-height:1.45; }
    .detail-authority { margin-top:10px; padding:10px 12px; border-radius:10px; background:#eaf3de; border-left:3px solid #639922; }
    .detail-authority .label { font-size:11px; font-weight:700; color:#27500a; margin-bottom:4px; }
    .detail-authority .dept, .detail-authority .phone { font-size:13px; color:#173404; }
    .detail-authority .phone { margin-top:2px; }
    .empty-list { padding:30px 14px; text-align:center; color:var(--muted); }
    @media(max-width:760px) { .shell { grid-template-columns:1fr; grid-template-rows:390px 420px; height:810px; } .side { border-left:0; border-top:1px solid var(--line); } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="map-wrap">
      <div id="map"></div>
      <div id="mapEmpty" class="map-empty"><div><strong>카카오 지도 키가 필요합니더</strong><span>.env에 JavaScript 키를 넣고 화면을 새로고침하십시오.</span><br><code>KAKAO_MAP_APP_KEY=발급받은_JavaScript_키</code></div></div>
      <div class="legend"><span><i class="dot" style="background:#d93b36"></i>매우 높음</span><span><i class="dot" style="background:#ed7a2c"></i>높음</span><span><i class="dot" style="background:#e7b642"></i>보통</span><span><i class="dot" style="background:#3d8b68"></i>낮음</span></div>
      <div id="markerMenu" class="marker-menu">
        <div class="mm-title"></div>
        <button class="mm-repair">✅ 보수완료로 표시</button>
        <button class="mm-inspect">🔍 점검완료로 표시</button>
        <button class="mm-cancel">취소</button>
      </div>
    </section>
    <aside class="side">
      <header class="side-head">
        <div class="eyebrow">MAINTENANCE QUEUE</div>
        <h2>당일 상대 위험도 순위</h2>
        <div class="sub" id="countText">격자 목록을 불러오는 중</div>
        <div class="controls">
          <input id="search" placeholder="격자 ID 검색" />
          <select id="riskFilter"><option value="all">전체 등급</option><option>매우 높음</option><option>높음</option><option>보통</option><option>낮음</option></select>
        </div>
      </header>
      <div id="list" class="list"></div>
      <section id="detail" class="detail"></section>
    </aside>
  </main>
  <script>
    let rows = [];
    let kakaoKey = "";
    let map = null;
    let selectedId = null;
    let initialized = false;
    const markersById = new Map();
    const haloOverlaysById = new Map();
    const markerImageCache = new Map();
    let clusterer = null;
    let selectedMarker = null;
    const colors = {"매우 높음":"#d93b36","높음":"#ed7a2c","보통":"#e7b642","낮음":"#3d8b68"};

    const pct = v => Number.isFinite(Number(v)) ? `${(Number(v)*100).toFixed(1)}%` : "-";
    const num = (v, suffix="") => Number.isFinite(Number(v)) ? `${Number(v).toLocaleString("ko-KR",{maximumFractionDigits:1})}${suffix}` : "-";
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const label = r => (r.address && String(r.address).trim()) || r.grid_id;
    const normalizeBool = v => v === true || v === "true" || v === "True" || v === 1 || v === "1";

    function send(type, payload={}) {
      window.parent.postMessage({isStreamlitMessage:true,type,...payload}, "*");
    }

    function clearHalo(gridId) {
      const halo = haloOverlaysById.get(String(gridId));
      if (halo) {
        halo.setMap(null);
        haloOverlaysById.delete(String(gridId));
      }
    }

    function completeRepair(row) {
      const entry = markersById.get(String(row.grid_id));
      if (entry) {
        entry.completed = true;
        entry.inspected = false;
        entry.marker.setImage(imageFor(entry, selectedId === row.grid_id));
      }
      clearHalo(row.grid_id);
      send("streamlit:setComponentValue", {
        value: {action: "complete_repair", grid_id: row.grid_id, address: label(row)},
        dataType: "json",
      });
    }

    function completeInspection(row) {
      const entry = markersById.get(String(row.grid_id));
      if (entry && !entry.completed) {
        entry.inspected = true;
        entry.marker.setImage(imageFor(entry, selectedId === row.grid_id));
      }
      clearHalo(row.grid_id);
      send("streamlit:setComponentValue", {
        value: {action: "complete_inspection", grid_id: row.grid_id, address: label(row)},
        dataType: "json",
      });
    }

    function hideMarkerMenu() {
      const menu = document.getElementById("markerMenu");
      menu.style.display = "none";
      menu.onclick = null;
    }

    function showMarkerMenu(row) {
      if (normalizeBool(row.manual_completed)) return;
      const entry = markersById.get(String(row.grid_id));
      if (!entry || !map) return;
      const point = map.getProjection().containerPointFromCoords(entry.marker.getPosition());
      const menu = document.getElementById("markerMenu");
      menu.querySelector(".mm-title").textContent = label(row);
      menu.style.left = `${point.x + 10}px`;
      menu.style.top = `${point.y + 10}px`;
      menu.style.display = "block";
      menu.onclick = event => {
        const target = event.target.closest("button");
        if (!target) return;
        hideMarkerMenu();
        if (target.classList.contains("mm-repair")) {
          if (window.confirm(`${label(row)}\n\n이 위치를 보수완료로 표시할까요?`)) completeRepair(row);
        } else if (target.classList.contains("mm-inspect")) {
          if (window.confirm(`${label(row)}\n\n점검완료로 표시할까요?\n위험도는 유지되고, ${14}일간 조치 우선순위에서만 제외됩니다.`)) completeInspection(row);
        }
      };
    }

    document.addEventListener("click", event => {
      const menu = document.getElementById("markerMenu");
      if (menu.style.display === "block" && !menu.contains(event.target)) hideMarkerMenu();
    });

    function filteredRows() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const level = document.getElementById("riskFilter").value;
      return rows.filter(r => (!q || String(label(r)).toLowerCase().includes(q) || String(r.grid_id).toLowerCase().includes(q)) && (level === "all" || r.risk_level === level));
    }

    function renderList() {
      const filtered = filteredRows();
      document.getElementById("countText").textContent = `${filtered.length.toLocaleString("ko-KR")}개 격자 · 당일 상대 위험도 순`;
      document.getElementById("list").innerHTML = filtered.length ? filtered.map((r, i) => `
        <button class="card ${selectedId === r.grid_id ? "active" : ""}" data-id="${esc(r.grid_id)}">
          <span class="rank">${i + 1}</span>
          <span class="score-inline" style="color:${colors[r.risk_level] || "#66756f"}">${num(r.road_risk_score, "점")}</span>
          <span><span class="name">${esc(label(r))}</span><span class="reason">${esc(r.risk_reason)}</span></span>
          <span class="level" style="color:${colors[r.risk_level] || "#66756f"}">${esc(r.risk_level)}</span>
        </button>`).join("") : '<div class="empty-list">조건에 맞는 격자가 없습니더.</div>';
      document.querySelectorAll(".card").forEach(el => el.addEventListener("click", () => selectRow(el.dataset.id, true)));
    }

    function markerImage(color, size, selected) {
      const key = `${color}_${size}_${selected}`;
      if (markerImageCache.has(key)) return markerImageCache.get(key);
      const d = selected ? Math.round(size * 1.3) + 4 : size + 4;
      const r = (d - 4) / 2;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${d}" height="${d}"><circle cx="${d/2}" cy="${d/2}" r="${r}" fill="${color}" stroke="#fff" stroke-width="${selected ? 3 : 2}"/></svg>`;
      const src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new kakao.maps.MarkerImage(src, new kakao.maps.Size(d, d), {offset: new kakao.maps.Point(d / 2, d / 2)});
      markerImageCache.set(key, image);
      return image;
    }

    function checkmarkImage(selected) {
      const key = `check_${selected}`;
      if (markerImageCache.has(key)) return markerImageCache.get(key);
      const d = selected ? 30 : 24;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${d}" height="${d}"><circle cx="${d/2}" cy="${d/2}" r="${d/2-2}" fill="#13795b" stroke="#fff" stroke-width="${selected ? 3 : 2}"/><path d="M${d*0.28} ${d*0.52} L${d*0.44} ${d*0.68} L${d*0.74} ${d*0.32}" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new kakao.maps.MarkerImage(src, new kakao.maps.Size(d, d), {offset: new kakao.maps.Point(d / 2, d / 2)});
      markerImageCache.set(key, image);
      return image;
    }

    function inspectionImage(selected) {
      const key = `inspect_${selected}`;
      if (markerImageCache.has(key)) return markerImageCache.get(key);
      const d = selected ? 30 : 24;
      const cx = d * 0.44, cy = d * 0.44, r = d * 0.2;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${d}" height="${d}"><circle cx="${d/2}" cy="${d/2}" r="${d/2-2}" fill="#2c5aa0" stroke="#fff" stroke-width="${selected ? 3 : 2}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="2"/><line x1="${cx + r * 0.75}" y1="${cy + r * 0.75}" x2="${d*0.72}" y2="${d*0.72}" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>`;
      const src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new kakao.maps.MarkerImage(src, new kakao.maps.Size(d, d), {offset: new kakao.maps.Point(d / 2, d / 2)});
      markerImageCache.set(key, image);
      return image;
    }

    function imageFor(entry, selected) {
      if (entry.completed) return checkmarkImage(selected);
      if (entry.inspected) return inspectionImage(selected);
      return markerImage(entry.color, entry.size, selected);
    }

    function selectRow(id, pan) {
      const row = rows.find(r => String(r.grid_id) === String(id));
      if (!row) return;
      selectedId = row.grid_id;
      if (selectedMarker) {
        const prev = selectedMarker;
        prev.marker.setImage(imageFor(prev, false));
      }
      const entry = markersById.get(String(id));
      if (entry) {
        entry.marker.setImage(imageFor(entry, true));
        entry.marker.setZIndex(10);
        selectedMarker = entry;
      } else {
        selectedMarker = null;
      }
      const authorityHtml = row.road_authority_dept ? `
        <div class="detail-authority">
          <div class="label">관할 보수 담당</div>
          <div class="dept">${esc(row.road_authority_dept)}</div>
          <div class="phone">☎ ${esc(row.road_authority_phone)}</div>
        </div>` : "";
      const detail = document.getElementById("detail");
      detail.className = "detail show";
      detail.innerHTML = `<div class="detail-top"><span class="detail-title">#${esc(row.priority_rank)} · ${esc(label(row))}</span><button class="close" aria-label="닫기">×</button></div>
        <div class="detail-grid"><div class="metric"><b>${pct(row.risk_score)}</b><span>모델 위험도</span></div><div class="metric"><b>${pct(row.recurrence_score)}</b><span>재발 위험</span></div><div class="metric"><b>${pct(row.priority_score)}</b><span>우선순위 점수</span></div><div class="metric"><b>${num(row.precip_7d,"mm")}</b><span>7일 강수</span></div><div class="metric"><b>${num(row.freeze_thaw_7d,"회")}</b><span>동결·융해</span></div><div class="metric"><b>${num(row.past_potholes_total,"건")}</b><span>누적 포트홀</span></div></div>
        <div class="detail-reason"><b>모델 기여 원인</b><br>${esc(row.risk_reason)}</div>${authorityHtml}`;
      detail.querySelector(".close").addEventListener("click", () => { selectedId = null; detail.className="detail"; renderList(); });
      renderList();
      if (pan && map && window.kakao) { map.panTo(new kakao.maps.LatLng(Number(row.grid_lat), Number(row.grid_lon))); map.setLevel(5); }
    }

    function showMapError(title, message) {
      const empty = document.getElementById("mapEmpty");
      empty.style.display = "grid";
      empty.querySelector("strong").textContent = title;
      empty.querySelector("span").textContent = message;
    }

    function initMap() {
      const valid = rows.filter(r => Number.isFinite(Number(r.grid_lat)) && Number.isFinite(Number(r.grid_lon)));
      if (!valid.length) { showMapError("표시할 좌표가 없습니더", "예측 CSV의 위도·경도를 확인하십시오."); return; }
      const avgLat = valid.reduce((s,r) => s + Number(r.grid_lat), 0) / valid.length;
      const avgLon = valid.reduce((s,r) => s + Number(r.grid_lon), 0) / valid.length;
      map = new kakao.maps.Map(document.getElementById("map"), {center:new kakao.maps.LatLng(avgLat,avgLon),level:11});
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      const HIGH_RISK_LEVELS = new Set(["매우 높음", "높음"]);
      const allMarkers = [];
      valid.forEach(r => {
        const size = Math.round(14 + Number(r.risk_score || 0) * 14);
        const color = colors[r.risk_level] || "#3d8b68";
        const completed = normalizeBool(r.manual_completed);
        const inspected = normalizeBool(r.inspection_suppressed);
        const statusLabel = completed ? "보수완료" : (inspected ? "점검완료" : `위험도 ${pct(r.risk_score)}`);
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(Number(r.grid_lat), Number(r.grid_lon)),
          image: completed ? checkmarkImage(false) : (inspected ? inspectionImage(false) : markerImage(color, size, false)),
          title: `${label(r)} · ${statusLabel}`,
          zIndex: (completed || inspected) ? 5 : (Number(r.priority_rank) <= 20 ? 3 : 1),
        });
        kakao.maps.event.addListener(marker, "click", () => selectRow(r.grid_id, false));
        kakao.maps.event.addListener(marker, "rightclick", () => showMarkerMenu(r));
        markersById.set(String(r.grid_id), {marker, color, size, completed, inspected});
        allMarkers.push(marker);
        if (r.action_level === "긴급점검" && !completed && !inspected) {
          const halo = document.createElement("div");
          halo.className = "pulse-halo";
          const haloOverlay = new kakao.maps.CustomOverlay({
            map,
            position: new kakao.maps.LatLng(Number(r.grid_lat), Number(r.grid_lon)),
            content: halo,
            zIndex: 0,
            xAnchor: 0.5,
            yAnchor: 0.5,
          });
          haloOverlaysById.set(String(r.grid_id), haloOverlay);
        }
      });
      clusterer = new kakao.maps.MarkerClusterer({
        map, markers: allMarkers, averageCenter: false, gridSize: 160, minLevel: 6,
        disableClickZoom: false,
        styles: [{
          width: "40px", height: "40px", lineHeight: "40px",
          background: "rgba(13,107,79,.85)", color: "#fff",
          borderRadius: "50%", textAlign: "center", fontWeight: "800", fontSize: "13px",
        }],
      });
    }

    function initialize() {
      renderList();
      if (!kakaoKey) { showMapError("카카오 지도 키가 필요합니더", ".env에 JavaScript 키를 입력하고 새로고침하십시오."); return; }
      const sdk = document.createElement("script");
      sdk.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(kakaoKey)}&autoload=false&libraries=clusterer`;
      sdk.onload = () => kakao.maps.load(initMap);
      sdk.onerror = () => showMapError("카카오 지도를 불러오지 못했습니더", "REST API 키가 아닌 JavaScript 키인지, localhost:8501이 Web 플랫폼에 등록됐는지 확인하십시오.");
      document.head.appendChild(sdk);
    }

    window.addEventListener("message", event => {
      if (event.data?.type !== "streamlit:render") return;
      rows = Array.isArray(event.data.args?.rows) ? event.data.args.rows : [];
      rows = rows.slice().sort((a, b) => (Number(b.road_risk_score) || 0) - (Number(a.road_risk_score) || 0));
      kakaoKey = String(event.data.args?.appKey || "");
      const height = Number(event.data.args?.componentHeight || 730);
      send("streamlit:setFrameHeight", {height});
      if (!initialized) { initialized = true; initialize(); } else { renderList(); }
    });
    document.getElementById("search").addEventListener("input", renderList);
    document.getElementById("riskFilter").addEventListener("change", renderList);
    send("streamlit:componentReady", {apiVersion:1});
    send("streamlit:setFrameHeight", {height:730});
  </script>
